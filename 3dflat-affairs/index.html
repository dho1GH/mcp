<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat Digital Twin</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1c1c2e;
    --border: #2a2a3e;
    --text: #e8e6f0;
    --text-muted: #8886a0;
    --accent: #6e6bff;
    --accent-glow: #6e6bff44;
    --warm: #ff8c6b;
    --green: #4ade80;
    --yellow: #fbbf24;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  canvas { display: block; }

  /* ---- Side Panel ---- */
  #panel {
    position: absolute;
    top: 16px;
    right: 16px;
    bottom: 16px;
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(20px);
    transition: transform 0.3s ease;
  }

  #panel.collapsed {
    transform: translateX(calc(100% + 16px));
  }

  #panel-toggle {
    position: absolute;
    top: 20px;
    right: 372px;
    z-index: 11;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  #panel-toggle:hover { background: var(--surface-hover); }
  #panel.collapsed ~ #panel-toggle { right: 16px; }

  .panel-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .panel-header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ---- Room Cards ---- */
  .room-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .room-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow);
  }

  .room-card.active {
    border-color: var(--accent);
    background: #12122a;
  }

  .room-card h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .room-card .stats {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  .room-card .stats span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .room-card .connections {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-hover);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .tag.door { border-color: var(--warm); color: var(--warm); }
  .tag.open { border-color: var(--green); color: var(--green); }

  /* ---- Object List ---- */
  .object-list {
    margin-top: 12px;
    display: none;
  }

  .room-card.active .object-list { display: block; }

  .object-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }

  .object-item:last-child { border-bottom: none; }

  .object-item .type {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 10px;
  }

  .object-item .dims {
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  /* ---- Query Bar ---- */
  #query-bar {
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  #query-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
  }

  #query-input:focus { border-color: var(--accent); }
  #query-input::placeholder { color: var(--text-muted); }

  #query-result {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---- HUD Overlay ---- */
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
  }

  #hud .label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  /* ---- View Controls ---- */
  #view-controls {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }

  .view-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font);
    font-weight: 500;
    transition: all 0.15s;
  }

  .view-btn:hover { color: var(--text); background: var(--surface-hover); }
  .view-btn.active { color: var(--accent); background: var(--accent-glow); }

  /* ---- Loading ---- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 100;
    transition: opacity 0.5s;
  }

  #loading.done { opacity: 0; pointer-events: none; }

  .loader {
    text-align: center;
  }

  .loader-bar {
    width: 200px;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .loader-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
    border-radius: 1px;
  }

  .loader p {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  @media (max-width: 768px) {
    #panel { width: 280px; top: 8px; right: 8px; bottom: 8px; }
    #panel-toggle { right: 300px; }
    #panel.collapsed ~ #panel-toggle { right: 8px; }
  }
</style>

<body>

<div id="loading">
  <div class="loader">
    <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
    <p id="loader-text">Initialising spatial graph…</p>
  </div>
</div>

<div id="canvas-container"></div>

<div id="hud">
  <div class="label" id="hud-coords">Ready</div>
</div>

<div id="view-controls">
  <button class="view-btn active" data-view="perspective" onclick="setView('perspective')">3D</button>
  <button class="view-btn" data-view="top" onclick="setView('top')">Plan</button>
  <button class="view-btn" data-view="front" onclick="setView('front')">Front</button>
  <button class="view-btn" data-view="side" onclick="setView('side')">Side</button>
</div>

<button id="panel-toggle" onclick="togglePanel()">◀</button>

<div id="panel">
  <div class="panel-header">
    <h1>Flat Digital Twin</h1>
    <p>Spatial graph · <span id="node-count">0</span> nodes · <span id="edge-count">0</span> edges</p>
  </div>
  <div class="panel-body" id="room-list"></div>
  <div id="query-bar">
    <input type="text" id="query-input" placeholder="Query: distance sofa television" 
           onkeydown="if(event.key==='Enter')runQuery()">
    <div id="query-result"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js"

<script type="module">
import * as THREE from 'three';

// ============================================================================
// Graph Data (embedded at build; fetched from /api/graph in production)
// ============================================================================
let GRAPH_DATA = null;

async function loadGraph() {
  updateLoader(20, 'Loading spatial graph…');
  try {
    const resp = await fetch('/api/graph');
    GRAPH_DATA = await resp.json();
  } catch {
    // Fallback: use embedded data
    GRAPH_DATA = window.__GRAPH_DATA__;
  }
  if (!GRAPH_DATA) {
    // Generate minimal fallback from what we know
    GRAPH_DATA = generateFallbackGraph();
  }
  updateLoader(40, 'Parsing room geometry…');
}

function generateFallbackGraph() {
  // Hardcoded from the actual USDZ analysis
  return {
    nodes: [
      { id: "room_1", label: "Room", properties: { name: "Open Plan Kitchen/Living", scan_id: "open_plan" }},
      { id: "room_2", label: "Room", properties: { name: "Primary Bedroom Wing", scan_id: "bedroom_wing" }},
      { id: "room_3", label: "Room", properties: { name: "Hallway", scan_id: "hallway" }},
      { id: "room_4", label: "Room", properties: { name: "Secondary Bedroom (Beta)", scan_id: "secondary_bedroom" }},
      // Objects with bounding boxes from USDZ
      { id: "obj_floor_op", label: "Floor", properties: { name: "Open Plan Floor", bbox_m: { min: [-2.73,-4.42,-0.16], max: [3.51,1.70,0], size_m: [6.24,6.12,0.16] }}},
      { id: "obj_sofa", label: "Sofa", properties: { name: "Sofa0", bbox_m: { min: [-0.87,-0.41,-0.52], max: [0.87,0.41,0.52], size_m: [1.74,0.82,1.04] }}},
      { id: "obj_tv", label: "Television", properties: { name: "Television0", bbox_m: { min: [-0.46,-0.36,-0.04], max: [0.46,0.36,0.04], size_m: [0.92,0.72,0.08] }}},
      { id: "obj_table", label: "Table", properties: { name: "Table0", bbox_m: { min: [-0.59,-0.20,-0.52], max: [0.59,0.20,0.52], size_m: [1.18,0.40,1.04] }}},
      { id: "obj_bed", label: "Bed", properties: { name: "Bed0", bbox_m: { min: [-0.71,-0.33,-0.95], max: [0.71,0.33,0.95], size_m: [1.42,0.66,1.90] }}},
      { id: "obj_floor_bed", label: "Floor", properties: { name: "Bedroom Floor", bbox_m: { min: [-3.26,-1.79,-0.16], max: [3.26,1.79,0], size_m: [6.52,3.58,0.16] }}},
      { id: "obj_floor_hall", label: "Floor", properties: { name: "Hallway Floor", bbox_m: { min: [-4.24,-1.54,-0.16], max: [4.24,1.54,0], size_m: [8.48,3.08,0.16] }}},
      { id: "obj_toilet", label: "Toilet", properties: { name: "Toilet0", bbox_m: { min: [-0.19,-0.41,-0.33], max: [0.19,0.41,0.33], size_m: [0.38,0.82,0.66] }}},
      { id: "obj_sink_bath", label: "Sink", properties: { name: "Sink0", bbox_m: { min: [-0.28,-0.15,-0.21], max: [0.28,0.15,0.21], size_m: [0.56,0.30,0.42] }}},
    ],
    edges: [
      { from: "room_1", to: "obj_floor_op", type: "CONTAINS" },
      { from: "room_1", to: "obj_sofa", type: "CONTAINS" },
      { from: "room_1", to: "obj_tv", type: "CONTAINS" },
      { from: "room_1", to: "obj_table", type: "CONTAINS" },
      { from: "room_2", to: "obj_bed", type: "CONTAINS" },
      { from: "room_2", to: "obj_floor_bed", type: "CONTAINS" },
      { from: "room_2", to: "obj_toilet", type: "CONTAINS" },
      { from: "room_2", to: "obj_sink_bath", type: "CONTAINS" },
      { from: "room_3", to: "obj_floor_hall", type: "CONTAINS" },
      { from: "room_3", to: "room_1", type: "ADJACENT_TO", properties: { connection: "open" }},
      { from: "room_3", to: "room_4", type: "ADJACENT_TO", properties: { connection: "door" }},
      { from: "room_3", to: "room_2", type: "ADJACENT_TO", properties: { connection: "door" }},
    ]
  };
}

// ============================================================================
// Three.js Scene
// ============================================================================

let scene, camera, renderer, controls;
let roomMeshes = new Map();
let objectMeshes = new Map();
let raycaster, mouse;
let selectedRoom = null;

// Room colors
const ROOM_COLORS = {
  open_plan:         0x6e6bff,
  bedroom_wing:      0xff8c6b,
  hallway:           0x4ade80,
  secondary_bedroom: 0xfbbf24,
};

// Room positions (manually laid out from floor plan analysis)
// Coordinate system: X = east, Z = south, Y = up
const ROOM_POSITIONS = {
  open_plan:         { x: 3, z: -2, w: 6.2, d: 6.1 },
  bedroom_wing:      { x: -2, z: 2, w: 6.5, d: 3.6 },
  hallway:           { x: 0, z: 0, w: 1.3, d: 8.5 },
  secondary_bedroom: { x: -2, z: -2, w: 4.1, d: 5.3 },
};

function initScene() {
  updateLoader(60, 'Building 3D scene…');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.FogExp2(0x0a0a0f, 0.02);

  // Camera
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(12, 14, 12);
  camera.lookAt(0, 0, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambient);

  const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
  mainLight.position.set(10, 20, 10);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(2048, 2048);
  mainLight.shadow.camera.near = 0.5;
  mainLight.shadow.camera.far = 50;
  mainLight.shadow.camera.left = -15;
  mainLight.shadow.camera.right = 15;
  mainLight.shadow.camera.top = 15;
  mainLight.shadow.camera.bottom = -15;
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0x6e6bff, 0.15);
  fillLight.position.set(-5, 10, -5);
  scene.add(fillLight);

  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({ 
    color: 0x0c0c14, roughness: 0.95, metalness: 0 
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  const gridHelper = new THREE.GridHelper(30, 30, 0x1a1a2e, 0x1a1a2e);
  gridHelper.position.y = 0;
  scene.add(gridHelper);

  // Interaction
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  updateLoader(70, 'Constructing rooms…');
}

function buildRooms() {
  const rooms = GRAPH_DATA.nodes.filter(n => n.label === "Room");
  const WALL_HEIGHT = 2.5;
  const WALL_THICKNESS = 0.16;

  for (const room of rooms) {
    const scanId = room.properties.scan_id;
    const pos = ROOM_POSITIONS[scanId];
    if (!pos) continue;

    const color = ROOM_COLORS[scanId] || 0x888888;
    const group = new THREE.Group();
    group.userData = { roomId: room.id, roomData: room };

    // Floor
    const floorGeo = new THREE.BoxGeometry(pos.w, 0.08, pos.d);
    const floorMat = new THREE.MeshStandardMaterial({ 
      color: color, 
      roughness: 0.6, 
      metalness: 0.1,
      transparent: true,
      opacity: 0.3
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = 0.04;
    floor.receiveShadow = true;
    group.add(floor);

    // Walls (4 sides, with gaps for doors)
    const wallMat = new THREE.MeshStandardMaterial({
      color: color,
      roughness: 0.4,
      metalness: 0.05,
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide
    });

    // North wall
    const nWall = new THREE.Mesh(
      new THREE.BoxGeometry(pos.w, WALL_HEIGHT, WALL_THICKNESS), wallMat
    );
    nWall.position.set(0, WALL_HEIGHT / 2, -pos.d / 2);
    nWall.castShadow = true;
    group.add(nWall);

    // South wall
    const sWall = new THREE.Mesh(
      new THREE.BoxGeometry(pos.w, WALL_HEIGHT, WALL_THICKNESS), wallMat
    );
    sWall.position.set(0, WALL_HEIGHT / 2, pos.d / 2);
    sWall.castShadow = true;
    group.add(sWall);

    // East wall
    const eWall = new THREE.Mesh(
      new THREE.BoxGeometry(WALL_THICKNESS, WALL_HEIGHT, pos.d), wallMat
    );
    eWall.position.set(pos.w / 2, WALL_HEIGHT / 2, 0);
    eWall.castShadow = true;
    group.add(eWall);

    // West wall
    const wWall = new THREE.Mesh(
      new THREE.BoxGeometry(WALL_THICKNESS, WALL_HEIGHT, pos.d), wallMat
    );
    wWall.position.set(-pos.w / 2, WALL_HEIGHT / 2, 0);
    wWall.castShadow = true;
    group.add(wWall);

    // Edge glow lines
    const edgeGeo = new THREE.EdgesGeometry(floorGeo);
    const edgeMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
    const edges = new THREE.LineSegments(edgeGeo, edgeMat);
    edges.position.y = 0.04;
    group.add(edges);

    // Room label sprite
    const labelCanvas = document.createElement('canvas');
    labelCanvas.width = 512;
    labelCanvas.height = 64;
    const ctx = labelCanvas.getContext('2d');
    ctx.font = '500 28px Inter, sans-serif';
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
    ctx.textAlign = 'center';
    ctx.fillText(room.properties.name, 256, 40);

    const labelTexture = new THREE.CanvasTexture(labelCanvas);
    const labelMat = new THREE.SpriteMaterial({ map: labelTexture, transparent: true, opacity: 0.8 });
    const label = new THREE.Sprite(labelMat);
    label.scale.set(4, 0.5, 1);
    label.position.y = 3;
    group.add(label);

    group.position.set(pos.x, 0, pos.z);
    scene.add(group);
    roomMeshes.set(room.id, group);

    // Add contained objects
    const containedEdges = GRAPH_DATA.edges.filter(e => e.from === room.id && e.type === "CONTAINS");
    for (const edge of containedEdges) {
      const obj = GRAPH_DATA.nodes.find(n => n.id === edge.to);
      if (!obj || !obj.properties.bbox_m || obj.label === "Wall" || obj.label === "Floor" || obj.label === "Door" || obj.label === "Window") continue;

      const bbox = obj.properties.bbox_m;
      const objGeo = new THREE.BoxGeometry(
        bbox.size_m[0] || 0.5,
        bbox.size_m[2] || 0.5,  // Z in USDZ -> Y in scene
        bbox.size_m[1] || 0.5   // Y in USDZ -> Z in scene
      );
      const objMat = new THREE.MeshStandardMaterial({
        color: 0xe8e6f0,
        roughness: 0.3,
        metalness: 0.1,
        transparent: true,
        opacity: 0.6
      });
      const objMesh = new THREE.Mesh(objGeo, objMat);
      
      // Position objects within the room
      const spread = 0.6;
      const idx = containedEdges.indexOf(edge);
      const angle = (idx / containedEdges.length) * Math.PI * 2;
      objMesh.position.set(
        Math.cos(angle) * pos.w * spread * 0.3,
        (bbox.size_m[2] || 0.5) / 2 + 0.08,
        Math.sin(angle) * pos.d * spread * 0.3
      );
      objMesh.castShadow = true;
      objMesh.userData = { objectId: obj.id, objectData: obj };
      group.add(objMesh);
      objectMeshes.set(obj.id, objMesh);
    }
  }

  // Draw connection lines between adjacent rooms
  const adjacencyEdges = GRAPH_DATA.edges.filter(e => 
    e.type === "ADJACENT_TO" || e.type === "CONNECTS_TO"
  );

  for (const edge of adjacencyEdges) {
    const fromGroup = roomMeshes.get(edge.from);
    const toGroup = roomMeshes.get(edge.to);
    if (!fromGroup || !toGroup) continue;

    const points = [fromGroup.position.clone(), toGroup.position.clone()];
    points[0].y = 0.15;
    points[1].y = 0.15;

    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const isOpen = edge.properties?.connection === "open";
    const lineMat = new THREE.LineDashedMaterial({
      color: isOpen ? 0x4ade80 : 0xff8c6b,
      dashSize: isOpen ? 0.5 : 0.2,
      gapSize: 0.1,
      transparent: true,
      opacity: 0.4
    });
    const line = new THREE.Line(lineGeo, lineMat);
    line.computeLineDistances();
    scene.add(line);
  }

  updateLoader(90, 'Finalising…');
}

// ============================================================================
// UI Panel
// ============================================================================

function buildPanel() {
  const rooms = GRAPH_DATA.nodes.filter(n => n.label === "Room");
  const roomList = document.getElementById('room-list');
  
  document.getElementById('node-count').textContent = GRAPH_DATA.nodes.length;
  document.getElementById('edge-count').textContent = GRAPH_DATA.edges.length;

  for (const room of rooms) {
    const objects = GRAPH_DATA.edges
      .filter(e => e.from === room.id && e.type === "CONTAINS")
      .map(e => GRAPH_DATA.nodes.find(n => n.id === e.to))
      .filter(Boolean);

    const connections = GRAPH_DATA.edges
      .filter(e => (e.from === room.id || e.to === room.id) && 
                   (e.type === "ADJACENT_TO" || e.type === "CONNECTS_TO"))
      .map(e => {
        const otherId = e.from === room.id ? e.to : e.from;
        const other = GRAPH_DATA.nodes.find(n => n.id === otherId);
        return { name: other?.properties?.name || otherId, type: e.properties?.connection || "connected" };
      });

    const walls = objects.filter(o => o.label === "Wall").length;
    const doors = objects.filter(o => o.label === "Door").length;
    const furniture = objects.filter(o => !["Wall","Floor","Door","Window","Unknown"].includes(o.label));

    const card = document.createElement('div');
    card.className = 'room-card';
    card.dataset.roomId = room.id;
    card.innerHTML = `
      <h3>${room.properties.name}</h3>
      <div class="stats">
        <span>⬡ ${walls} walls</span>
        <span>◨ ${doors} doors</span>
        <span>▣ ${furniture.length} objects</span>
      </div>
      <div class="connections">
        ${connections.map(c => `<span class="tag ${c.type}">${c.type === 'open' ? '↔' : '🚪'} ${c.name}</span>`).join('')}
      </div>
      <div class="object-list">
        ${furniture.map(o => `
          <div class="object-item">
            <span>${o.properties.name}</span>
            <span class="type">${o.label}</span>
            <span class="dims">${o.properties.bbox_m?.size_m ? 
              o.properties.bbox_m.size_m.map(v => v.toFixed(1) + 'm').join(' × ') : '—'
            }</span>
          </div>
        `).join('')}
      </div>
    `;

    card.onclick = () => selectRoom(room.id, card);
    roomList.appendChild(card);
  }
}

function selectRoom(roomId, cardEl) {
  // Deselect previous
  document.querySelectorAll('.room-card').forEach(c => c.classList.remove('active'));
  
  if (selectedRoom === roomId) {
    selectedRoom = null;
    resetRoomHighlights();
    return;
  }

  selectedRoom = roomId;
  cardEl.classList.add('active');

  // Highlight in 3D
  roomMeshes.forEach((group, id) => {
    group.children.forEach(child => {
      if (child.material && child.material.opacity !== undefined) {
        child.material.opacity = id === roomId ? 
          (child.material.userData?.baseOpacity || 0.6) : 0.08;
      }
    });
  });

  // Fly camera to room
  const group = roomMeshes.get(roomId);
  if (group) {
    animateCamera(
      { x: group.position.x + 6, y: 8, z: group.position.z + 6 },
      group.position
    );
  }
}

function resetRoomHighlights() {
  roomMeshes.forEach(group => {
    group.children.forEach(child => {
      if (child.material && child.material.opacity !== undefined) {
        if (child instanceof THREE.Mesh) {
          child.material.opacity = child.material.userData?.baseOpacity || 
            (child.geometry.type === 'BoxGeometry' ? 0.3 : 0.6);
        }
      }
    });
  });
}

// ============================================================================
// Camera Controls (simple orbit)
// ============================================================================

let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let cameraTarget = new THREE.Vector3(0, 0, 0);
let cameraRadius = 18;
let cameraTheta = Math.PI / 4;
let cameraPhi = Math.PI / 4;

function setupControls() {
  const canvas = renderer.domElement;

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - previousMousePosition.x;
    const dy = e.clientY - previousMousePosition.y;
    
    cameraTheta -= dx * 0.005;
    cameraPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraPhi - dy * 0.005));
    
    previousMousePosition = { x: e.clientX, y: e.clientY };
    updateCameraPosition();
  });

  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('mouseleave', () => { isDragging = false; });

  canvas.addEventListener('wheel', (e) => {
    cameraRadius = Math.max(4, Math.min(40, cameraRadius + e.deltaY * 0.02));
    updateCameraPosition();
  });

  // Touch support
  let touchStart = null;
  let touchDist = 0;

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      touchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && touchStart) {
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      cameraTheta -= dx * 0.005;
      cameraPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraPhi - dy * 0.005));
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCameraPosition();
    } else if (e.touches.length === 2) {
      const newDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      cameraRadius = Math.max(4, Math.min(40, cameraRadius * (touchDist / newDist)));
      touchDist = newDist;
      updateCameraPosition();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => { touchStart = null; });
  
  updateCameraPosition();
}

function updateCameraPosition() {
  camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
  camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
  camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
  camera.lookAt(cameraTarget);
}

function animateCamera(pos, target) {
  const startPos = camera.position.clone();
  const startTarget = cameraTarget.clone();
  const endPos = new THREE.Vector3(pos.x, pos.y, pos.z);
  const endTarget = new THREE.Vector3(target.x, target.y || 0, target.z);
  
  let t = 0;
  function step() {
    t += 0.03;
    if (t > 1) t = 1;
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    
    camera.position.lerpVectors(startPos, endPos, ease);
    cameraTarget.lerpVectors(startTarget, endTarget, ease);
    camera.lookAt(cameraTarget);
    
    // Update spherical coords
    const offset = camera.position.clone().sub(cameraTarget);
    cameraRadius = offset.length();
    cameraPhi = Math.acos(offset.y / cameraRadius);
    cameraTheta = Math.atan2(offset.z, offset.x);
    
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

// ============================================================================
// View presets
// ============================================================================

window.setView = function(view) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`).classList.add('active');

  switch (view) {
    case 'perspective':
      animateCamera({ x: 12, y: 14, z: 12 }, { x: 0, y: 0, z: 0 });
      break;
    case 'top':
      animateCamera({ x: 0, y: 22, z: 0.01 }, { x: 0, y: 0, z: 0 });
      break;
    case 'front':
      animateCamera({ x: 0, y: 4, z: 18 }, { x: 0, y: 1, z: 0 });
      break;
    case 'side':
      animateCamera({ x: 18, y: 4, z: 0 }, { x: 0, y: 1, z: 0 });
      break;
  }
};

// ============================================================================
// Query Engine (local, matches MCP tool interface)
// ============================================================================

window.runQuery = function() {
  const input = document.getElementById('query-input');
  const result = document.getElementById('query-result');
  const q = input.value.trim().toLowerCase();
  
  if (!q) return;
  
  let output = '';

  if (q.startsWith('distance') || q.includes('far')) {
    const words = q.replace(/distance|how far|is|from|the|to|between/g, '').trim().split(/\s+/);
    if (words.length >= 2) {
      const obj1 = findNodeByName(words[0]);
      const obj2 = findNodeByName(words.slice(1).join(' '));
      if (obj1 && obj2 && obj1.properties.bbox_m && obj2.properties.bbox_m) {
        const c1 = obj1.properties.bbox_m.min.map((v, i) => (v + obj1.properties.bbox_m.max[i]) / 2);
        const c2 = obj2.properties.bbox_m.min.map((v, i) => (v + obj2.properties.bbox_m.max[i]) / 2);
        const dist = Math.sqrt(c1.reduce((s, v, i) => s + (v - c2[i]) ** 2, 0));
        output = `${obj1.properties.name} ↔ ${obj2.properties.name}\n≈ ${dist.toFixed(2)}m (center-to-center)`;
      } else {
        output = 'Could not find both objects with coordinate data.';
      }
    }
  } else if (q.includes('room') || q.includes('list')) {
    const rooms = GRAPH_DATA.nodes.filter(n => n.label === "Room");
    output = rooms.map(r => `• ${r.properties.name}`).join('\n');
  } else if (q.includes('count') || q.includes('how many')) {
    const type = q.replace(/count|how many|are there/g, '').trim();
    const matches = GRAPH_DATA.nodes.filter(n => n.label.toLowerCase().includes(type));
    output = `${matches.length} ${type}(s) found across the flat.`;
  } else {
    // Search by name
    const matches = GRAPH_DATA.nodes.filter(n => 
      n.properties.name?.toLowerCase().includes(q) || n.label.toLowerCase().includes(q)
    );
    if (matches.length > 0) {
      output = matches.slice(0, 8).map(n => {
        const size = n.properties.bbox_m?.size_m;
        return `${n.label}: ${n.properties.name}${size ? ` (${size.map(v=>v.toFixed(1)+'m').join('×')})` : ''}`;
      }).join('\n');
    } else {
      output = 'No matches. Try: "distance sofa television", "count doors", "list rooms"';
    }
  }
  
  result.textContent = output;
};

function findNodeByName(name) {
  const lower = name.toLowerCase();
  return GRAPH_DATA.nodes.find(n => 
    n.properties.name?.toLowerCase().includes(lower) || 
    n.label.toLowerCase() === lower
  );
}

// ============================================================================
// Utilities
// ============================================================================

function updateLoader(pct, text) {
  document.getElementById('loader-fill').style.width = pct + '%';
  document.getElementById('loader-text').textContent = text;
}

window.togglePanel = function() {
  const panel = document.getElementById('panel');
  panel.classList.toggle('collapsed');
};

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============================================================================
// Animation Loop
// ============================================================================

function animate() {
  requestAnimationFrame(animate);

  // Subtle ambient rotation when idle
  if (!isDragging && !selectedRoom) {
    cameraTheta += 0.0005;
    updateCameraPosition();
  }

  renderer.render(scene, camera);
}

// ============================================================================
// Init
// ============================================================================

async function init() {
  await loadGraph();
  initScene();
  buildRooms();
  buildPanel();
  setupControls();
  
  window.addEventListener('resize', onResize);

  updateLoader(100, 'Ready');
  setTimeout(() => document.getElementById('loading').classList.add('done'), 300);

  animate();
}

init();
</script>
