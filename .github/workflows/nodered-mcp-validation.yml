name: Node-RED MCP validation

on:
  pull_request:
    paths:
      - "nodered-mcp-server/**"
      - ".github/workflows/nodered-mcp-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodered-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodered-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --outDir .test-build
      - run: node --test test/*.test.mjs
      - run: npx wrangler deploy --dry-run --outdir .worker-build
