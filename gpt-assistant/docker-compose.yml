services:
  assistant:
    build: .
    image: assistant
    container_name: assistant
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect((\"127.0.0.1\", 8765)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8765:8765"
    volumes:
      - gpt_assistant_data:/data
    networks:
      - lifeos-graph

volumes:
  gpt_assistant_data:

networks:
  lifeos-graph:
    external: true
