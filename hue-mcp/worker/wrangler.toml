name = "hue-mcp-server"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

# Stateless createMcpHandler — no Durable Objects needed.
# Each request gets a fresh MCP server; the Hue bridge is the source of truth.

# --- Non-secret config (safe to commit) ---
[vars]
# Base URL of the local executor, reachable through a Cloudflare Tunnel.
# e.g. "https://hue-executor.itsjeff.org" — no trailing slash.
HUE_EXECUTOR_BASE_URL = "https://hue-executor.itsjeff.org"

# --- Secrets (set with `wrangler secret put <NAME>`, never committed) ---
# HUE_EXECUTOR_BEARER_TOKEN  - bearer token the local executor requires
# MCP_AUTH_TOKEN              - shared bearer token this Worker requires from MCP callers
